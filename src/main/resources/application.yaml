spring:
  application.name: poultry-management-system
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_batch_fetch_size: 50
  jackson.time-zone: Asia/Manila
  docker.compose.lifecycle-management: start_only

app:
  zone: Asia/Manila
  security:
    # HS256 key, at least 32 bytes. Supply via APP_SECURITY_JWT_SECRET; there is deliberately no default.
    jwt-secret: ${APP_SECURITY_JWT_SECRET:}
    token-ttl: 8h
  bootstrap:
    # Creates the first OWNER only when the user table is empty and both values are supplied.
    owner-username: ${APP_BOOTSTRAP_OWNER_USERNAME:}
    owner-password: ${APP_BOOTSTRAP_OWNER_PASSWORD:}
  cors:
    # Browser origins allowed to call the API (exact scheme://host[:port], no wildcards). The defaults are the usual
    # local frontend dev servers (Vite and generic); production sets APP_CORS_ALLOWED_ORIGINS (see application-prod.yaml).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    max-age: 1h

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true

logging:
  # Every log line shows the request id (the X-Request-Id of the HTTP call), or nothing outside a request.
  pattern.correlation: "[%X{requestId:-}] "
